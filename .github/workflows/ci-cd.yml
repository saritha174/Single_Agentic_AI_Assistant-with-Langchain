name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------- 1. CI: check the code ----------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (syntax errors & undefined names)
        run: ruff check . --select E9,F63,F7,F82
      - name: Check all Python files compile
        run: python -m compileall -q -x '(\.venv|venv)' .
      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -v; else echo "No tests folder yet - skipping"; fi

  # ---------------- 2. Build & test the Docker image ----------------
  docker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t my-agent:${{ github.sha }} .

      - name: Start the container
        run: docker run -d -p 8501:8501 --name agent my-agent:${{ github.sha }}

      - name: Smoke test (is Streamlit alive?)
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo " -> App is healthy ✅"; exit 0
            fi
            echo "Waiting for app... ($i)"; sleep 3
          done
          echo "App did not start ❌"; docker logs agent; exit 1

  # ---------------- 3. CD: deploy only if everything passed ----------------
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set - skipping deploy"; exit 0
          fi
          curl -sf -X POST "$HOOK"
          echo "Deploy triggered ✅"
